<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Warehouse WMS Terminal</title>
  <style>
    :root {
      --bg-paper: #f4f1ea;
      --bg-paper-lighter: #fbfaf8;
      --text-main: #2b2b2b;
      --text-muted: #5a5a5a;
      --border-color: #d1cbbd;
      --accent-blue: #3d5a80;
      --accent-rust: #b24a35;
      --accent-green: #3a7a51;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--bg-paper-lighter);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; font-weight: 700; }
    p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .input-group { text-align: left; margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.4rem; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      background: #fff;
      font-family: monospace;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background: var(--text-main);
      color: #fff;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:active { background: #404040; }
    .status {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .quick-links {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px dotted var(--border-color);
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .chip {
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      background: var(--bg-paper);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      cursor: pointer;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>WAREHOUSE WMS</h1>
    <p>Mobile Fulfillment &amp; Scanner Terminal</p>

    <div class="input-group">
      <label for="serverUrl">Warehouse Server Address</label>
      <input type="text" id="serverUrl" placeholder="http://192.168.1.100:3000" />
    </div>

    <button type="button" id="connectBtn" onclick="connectToServer()">CONNECT TO TERMINAL</button>
    <div id="status" class="status">Enter your warehouse host PC IP or domain.</div>

    <div class="quick-links">
      <span class="chip" onclick="setServer('http://localhost:3000')">localhost:3000</span>
      <span class="chip" onclick="setServer('http://10.0.2.2:3000')">Android Emulator</span>
    </div>
  </div>

  <script>
    const DEFAULT_KEY = 'wms_server_url';
    const input = document.getElementById('serverUrl');
    const statusText = document.getElementById('status');

    const savedUrl = localStorage.getItem(DEFAULT_KEY);
    if (savedUrl) {
      input.value = savedUrl;
      statusText.innerText = 'Connecting to saved server: ' + savedUrl;
      // Auto-redirect if already configured
      setTimeout(() => {
        window.location.href = savedUrl;
      }, 1200);
    } else {
      input.value = window.location.origin.includes('localhost') ? window.location.origin : 'http://192.168.1.100:3000';
    }

    function setServer(url) {
      input.value = url;
    }

    function connectToServer() {
      let url = input.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      localStorage.setItem(DEFAULT_KEY, url);
      statusText.innerText = 'Connecting to ' + url + '...';
      window.location.href = url;
    }
  </script>
</body>
</html>
