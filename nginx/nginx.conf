# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — Warehouse WMS
# Routes: /api/v2/ → FastAPI :8000 | /ws/ → FastAPI WS | all else → Next.js :3000
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    # Combined format + real IP for threat detector parsing
    log_format combined_real '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log combined_real buffer=16k flush=5s;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;              # hide Nginx version

    # Upload size for Excel files (supports up to 100MB)
    client_max_body_size 100M;
    client_body_timeout 120s;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml;

    # ── Rate Limiting Zones ──────────────────────────────────────────────────
    # General: 100 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    # Login endpoint: 5 req/s per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
    # Upload endpoint: 3 req/s per IP
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=3r/s;
    # WebSocket connections: 10 per IP
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # ── Upstream Services ────────────────────────────────────────────────────
    upstream nextjs_backend {
        server nextjs:3000;
        keepalive 32;
    }

    upstream fastapi_backend {
        server fastapi:8000;
        keepalive 16;
    }

    # ── Main Server Block ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ────────────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"            always;
        add_header X-Content-Type-Options   "nosniff"               always;
        add_header X-XSS-Protection         "1; mode=block"         always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=self, microphone=()" always;
        # CSP: allow camera for barcode scanner
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.sheetjs.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self'; camera 'self'"
            always;

        # ── Auth Endpoints (strict rate limit) ──────────────────────────────
        location = /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/v2/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Upload Endpoint (size + rate limited) ────────────────────────────
        location ~ ^/(api/v2/upload|api/upload) {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 100M;
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSocket → FastAPI ──────────────────────────────────────────────
        location /ws/ {
            limit_conn ws_conn 10;
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 3600s;           # keep WS alive 1h
            proxy_send_timeout 3600s;
        }

        # ── FastAPI v2 REST API ──────────────────────────────────────────────
        location /api/v2/ {
            limit_req zone=general burst=200 nodelay;
            proxy_pass         http://fastapi_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Next.js (all other routes) ───────────────────────────────────────
        location / {
            limit_req zone=general burst=200 nodelay;
            proxy_pass         http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Next.js Hot Reload WebSocket (dev only) ──────────────────────────
        location /_next/webpack-hmr {
            proxy_pass         http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Static Assets (cache aggressively) ──────────────────────────────
        location /_next/static/ {
            proxy_pass         http://nextjs_backend;
            proxy_cache_valid  200 365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Block common scanner paths ───────────────────────────────────────
        location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|conf)$ {
            return 403;
        }

        location ~ /\. {
            deny all;
        }
    }

    # ── HTTPS server (uncomment when SSL certs are available) ────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # ... same location blocks as HTTP above ...
    # }
}
